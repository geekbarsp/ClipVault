<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ClipVault License Admin</title><link rel="stylesheet" href="styles.css"></head>
<body><main><section id="login" class="card"><img src="../src/ClipVault.App/Assets/Brand/ClipVaultLogo.png" alt="ClipVault"><h1>License Admin</h1><input id="email" type="email" placeholder="Admin email"><input id="password" type="password" placeholder="Password"><button id="signIn">Sign in</button><p id="loginError" class="error"></p></section>
<section id="dashboard" hidden><header><div><h1>ClipVault Licenses</h1><p>License metadata only. Clipboard data never enters Supabase.</p></div><button id="signOut" class="secondary">Sign out</button></header><div class="toolbar card"><label>Search <input id="search" type="search" placeholder="Key hint, status, device…"></label><label>Quantity <input id="count" type="number" min="1" max="100" value="1"></label><label>Valid days (blank = lifetime) <input id="days" type="number" min="1" max="3650"></label><label>Offline grace <input id="grace" type="number" min="0" max="30" value="7"></label><button id="create">Create license(s)</button><button id="refresh" class="secondary">Refresh</button></div><pre id="newKeys" hidden></pre><div class="card table"><table><thead><tr><th>Key</th><th>Status</th><th>HWID fingerprint</th><th>Activated</th><th>Expires</th><th>Last seen</th><th>Actions</th></tr></thead><tbody id="licenses"></tbody></table></div><h2>Recent audit events</h2><div class="card table"><table><thead><tr><th>Time</th><th>Action</th><th>Result</th><th>License</th></tr></thead><tbody id="events"></tbody></table></div></section></main><script src="config.js"></script><script src="app.js"></script></body></html>
